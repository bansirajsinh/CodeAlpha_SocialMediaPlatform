<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — Search for users, posts, or hashtags.">
  <title>Nebula — Search</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 font-weight-bold mb-0">Search</h1>
      </div>

      <!-- Search Input bar -->
      <div class="glass-panel mb-4 py-3">
        <form id="search-form" class="m-0">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 border-color"><i class="bi bi-search text-muted"></i></span>
            <input type="search" class="form-control border-start-0 border-color bg-transparent text-primary" id="search-input" placeholder="Search users, posts, or tags..." required style="box-shadow:none;">
            <button type="submit" class="btn btn-primary" style="border-top-left-radius:0; border-bottom-left-radius:0;">Search</button>
          </div>
        </form>
      </div>

      <!-- Search Tabs -->
      <ul class="nav nav-tabs border-color mb-4" id="searchTabs" role="tablist" style="border-bottom: 1px solid var(--border-color); display:none;">
        <li class="nav-item" role="presentation">
          <button class="nav-link active bg-transparent border-0 font-weight-semibold text-primary" id="all-tab" data-bs-toggle="tab" data-bs-target="#results-panel" type="button" role="tab" style="box-shadow:none; border-bottom: 2px solid var(--color-primary) !important;">All</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link bg-transparent border-0 font-weight-semibold text-muted" id="users-tab" data-bs-toggle="tab" data-bs-target="#results-panel" type="button" role="tab" style="box-shadow:none;">Users</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link bg-transparent border-0 font-weight-semibold text-muted" id="posts-tab" data-bs-toggle="tab" data-bs-target="#results-panel" type="button" role="tab" style="box-shadow:none;">Posts</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link bg-transparent border-0 font-weight-semibold text-muted" id="hashtags-tab" data-bs-toggle="tab" data-bs-target="#results-panel" type="button" role="tab" style="box-shadow:none;">Hashtags</button>
        </li>
      </ul>

      <!-- Results Container -->
      <div class="tab-content" id="searchTabsContent">
        <div class="tab-pane fade show active" id="results-panel" role="tabpanel">
          <div id="search-results-container">
            <div class="glass-panel text-center py-5" id="initial-search-msg">
              <i class="bi bi-compass text-muted" style="font-size: 3rem;"></i>
              <h4 class="mt-3 font-weight-bold">Search Nebula</h4>
              <p class="text-muted">Find friends, explore trending posts, or find hashtags.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/search.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();
      
      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');
      const tabsHeader = document.getElementById('searchTabs');
      const resultsContainer = document.getElementById('search-results-container');

      let currentTab = 'all';

      // Parse query params (e.g. from hashtag links)
      const urlParams = new URLSearchParams(window.location.search);
      const queryParam = urlParams.get('q');
      const typeParam = urlParams.get('type');

      if (queryParam) {
        searchInput.value = queryParam;
        if (typeParam) currentTab = typeParam;
        executeSearch(queryParam, currentTab);
      }

      // Bind Search Form submission
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (q) {
          executeSearch(q, currentTab);
        }
      });

      // Bind tabs click
      const tabs = ['all', 'users', 'posts', 'hashtags'];
      tabs.forEach(tabName => {
        const tabBtn = document.getElementById(`${tabName}-tab`);
        if (tabBtn) {
          tabBtn.addEventListener('click', (e) => {
            // Reset tab styling
            tabs.forEach(t => {
              const btn = document.getElementById(`${t}-tab`);
              btn.classList.remove('text-primary');
              btn.classList.add('text-muted');
              btn.style.borderBottom = 'none';
            });

            e.target.classList.add('text-primary');
            e.target.classList.remove('text-muted');
            e.target.style.borderBottom = '2px solid var(--color-primary)';
            
            currentTab = tabName;
            const q = searchInput.value.trim();
            if (q) {
              executeSearch(q, currentTab);
            }
          });
        }
      });

      async function executeSearch(query, type) {
        tabsHeader.style.display = 'flex';
        resultsContainer.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
        
        try {
          const resData = await search.searchAll(query, type);
          resultsContainer.innerHTML = '';

          // If global search
          if (type === 'all') {
            const { users = [], posts: postsList = [], hashtags = [] } = resData;
            
            if (users.length === 0 && postsList.length === 0 && hashtags.length === 0) {
              resultsContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No results found for "${query}"</p></div>`;
              return;
            }

            // Render users section if any
            if (users.length > 0) {
              const usersHtml = users.map(user => `
                <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-color">
                  <a href="/profile.html?userId=${user.user_id}" class="user-snippet" style="text-decoration:none;">
                    <img src="${user.profile_picture_url || utils.defaultAvatar}" alt="${user.username}" style="width:40px; height:40px;">
                    <div class="user-snippet-details">
                      <span class="user-snippet-name">${user.first_name || ''} ${user.last_name || ''}</span>
                      <span class="user-snippet-username">@${user.username}</span>
                    </div>
                  </a>
                </div>
              `).join('');
              resultsContainer.innerHTML += `
                <div class="glass-panel mb-4">
                  <h4 class="font-weight-bold mb-3" style="font-size: var(--font-size-lg);">People</h4>
                  ${usersHtml}
                </div>
              `;
            }

            // Render tags section if any
            if (hashtags.length > 0) {
              const tagsHtml = hashtags.map(tag => `
                <a href="/search.html?q=%23${tag.tag_name}&type=hashtags" class="trending-item p-2">
                  <span class="trending-tag">#${tag.tag_name}</span>
                  <span class="trending-count">${tag.usage_count} posts</span>
                </a>
              `).join('');
              resultsContainer.innerHTML += `
                <div class="glass-panel mb-4">
                  <h4 class="font-weight-bold mb-3" style="font-size: var(--font-size-lg);">Hashtags</h4>
                  <div class="d-flex flex-column">${tagsHtml}</div>
                </div>
              `;
            }

            // Render posts section if any
            if (postsList.length > 0) {
              const postsHtml = postsList.map(post => posts.renderPostCard(post, currentUser)).join('');
              resultsContainer.innerHTML += `
                <div class="mb-4">
                  <h4 class="font-weight-bold mb-3 px-3" style="font-size: var(--font-size-lg);">Posts</h4>
                  ${postsHtml}
                </div>
              `;
              posts.bindPostActions(resultsContainer);
            }
          } 
          
          // Specific users search
          else if (type === 'users') {
            if (resData.length === 0) {
              resultsContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No users found.</p></div>`;
              return;
            }
            const usersHtml = resData.map(user => `
              <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-color">
                <a href="/profile.html?userId=${user.user_id}" class="user-snippet" style="text-decoration:none;">
                  <img src="${user.profile_picture_url || utils.defaultAvatar}" alt="${user.username}" style="width:40px; height:40px;">
                  <div class="user-snippet-details">
                    <span class="user-snippet-name">${user.first_name || ''} ${user.last_name || ''}</span>
                    <span class="user-snippet-username">@${user.username}</span>
                  </div>
                </a>
              </div>
            `).join('');
            resultsContainer.innerHTML = `<div class="glass-panel">${usersHtml}</div>`;
          } 
          
          // Specific posts search
          else if (type === 'posts') {
            if (resData.length === 0) {
              resultsContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No posts found.</p></div>`;
              return;
            }
            resultsContainer.innerHTML = resData.map(post => posts.renderPostCard(post, currentUser)).join('');
            posts.bindPostActions(resultsContainer);
          } 
          
          // Specific hashtags search
          else if (type === 'hashtags') {
            if (resData.length === 0) {
              resultsContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No hashtags found.</p></div>`;
              return;
            }
            const tagsHtml = resData.map(tag => `
              <a href="/search.html?q=%23${tag.tag_name}&type=hashtags" class="trending-item p-3 border-bottom border-color">
                <span class="trending-tag">#${tag.tag_name}</span>
                <span class="trending-count">${tag.usage_count} posts</span>
              </a>
            `).join('');
            resultsContainer.innerHTML = `<div class="glass-panel d-flex flex-column">${tagsHtml}</div>`;
          }

        } catch (err) {
          resultsContainer.innerHTML = `<div class="glass-panel text-danger text-center py-5">Search execution failed.</div>`;
        }
      }
    });
  </script>
</body>
</html>
