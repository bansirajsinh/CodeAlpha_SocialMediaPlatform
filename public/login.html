<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — Login to your account to view your feed.">
  <title>Nebula — Login</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-app);
      padding: var(--space-4);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <div class="glass-panel auth-card animate-fade-in-up">
    <div class="text-center mb-4">
      <div class="logo-container justify-content-center pb-2">
        <i class="bi bi-hexagon-fill"></i>
        <span>Nebula</span>
      </div>
      <h2 class="mt-2 font-weight-bold">Welcome Back</h2>
      <p class="text-muted">Enter your credentials to access your account</p>
    </div>

    <form id="login-form">
      <div class="form-group mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-color"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" class="form-control border-start-0 border-color" id="email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="form-group mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-color"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control border-start-0 border-color" id="password" required placeholder="••••••••">
          <button class="btn btn-outline-secondary border-color" type="button" id="toggle-password" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 font-weight-bold mb-3" id="submit-btn">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="display: none;" id="btn-spinner"></span>
        Sign In
      </button>

      <div class="text-center mt-3">
        <span class="text-muted">Don't have an account?</span>
        <a href="register.html" class="font-weight-semibold ms-1">Sign Up</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Redirect if already logged in
    if (auth.isAuthenticated()) {
      window.location.href = '/index.html';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnSpinner = document.getElementById('btn-spinner');
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    // Show/Hide password toggle
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    // Helper to display input validation errors inline
    function showInputErrors(errors) {
      document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));

      errors.forEach(err => {
        const input = document.getElementById(err.field);
        if (input) {
          input.classList.add('is-invalid');
          const feedback = document.createElement('div');
          feedback.className = 'invalid-feedback d-block mt-1';
          feedback.innerText = err.message;
          const parent = input.closest('.input-group') || input.closest('.form-group');
          parent.appendChild(feedback);
        } else {
          utils.showToast(err.message, 'error');
        }
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      // Basic client-side checks
      const localErrors = [];
      if (!email) {
        localErrors.push({ field: 'email', message: 'Email address is required' });
      }
      if (!password) {
        localErrors.push({ field: 'password', message: 'Password is required' });
      }

      if (localErrors.length > 0) {
        showInputErrors(localErrors);
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';

      try {
        await auth.login(email, password);
      } catch (err) {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        if (err.details && err.details.errors) {
          showInputErrors(err.details.errors);
        }
      }
    });
  </script>
</body>
</html>
