<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit your profile — update bio, picture, and settings.">
  <title>Nebula — Edit Profile</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .edit-avatar-preview-centered {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 4px solid var(--color-primary);
      background: var(--bg-secondary);
      box-shadow: var(--shadow-md);
      margin: 0 auto;
    }
    .edit-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .edit-avatar-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }
    .edit-avatar-preview-centered:hover .edit-avatar-overlay {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      
      <!-- Back Arrow + Title -->
      <div class="d-flex align-items-center mb-4 gap-3">
        <a href="/profile.html" class="btn btn-outline border-0 text-muted p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;" id="back-profile-btn"><i class="bi bi-arrow-left" style="font-size:1.5rem;"></i></a>
        <h1 class="h3 font-weight-bold mb-0">Edit Profile</h1>
      </div>

      <!-- Edit Profile form -->
      <div class="glass-panel mb-4">
        <form id="edit-profile-form" enctype="multipart/form-data">
          
          <!-- Centered Avatar Photo Section -->
          <div class="d-flex flex-column align-items-center mb-4">
            <div class="edit-avatar-preview-centered">
              <img src="" alt="Avatar Photo" class="edit-avatar-img" id="edit-profile-avatar-preview">
              <div class="edit-avatar-overlay" id="avatar-overlay"><i class="bi bi-camera" style="font-size:1.5rem;"></i></div>
              <input type="file" id="avatar-file-input" accept="image/*" style="display:none;">
            </div>
            <span class="text-muted mt-2 small">Click avatar to upload new photo</span>
          </div>

          <!-- Form Fields -->
          <div class="row mt-4">
            <div class="col-md-6 mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control border-color bg-transparent text-primary" id="firstName" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control border-color bg-transparent text-primary" id="lastName" required>
            </div>
          </div>

          <div class="form-group mb-3">
            <label for="bio" class="form-label">Bio</label>
            <textarea class="form-control border-color bg-transparent text-primary" id="bio" rows="3" style="resize:none;" maxlength="200"></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="location" class="form-label">Location</label>
              <input type="text" class="form-control border-color bg-transparent text-primary" id="location" placeholder="San Francisco, CA">
            </div>
            <div class="col-md-6 mb-3">
              <label for="website" class="form-label">Website</label>
              <input type="text" class="form-control border-color bg-transparent text-primary" id="website" placeholder="example.com">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 mt-4">
            <a href="/profile.html" class="btn btn-outline" id="cancel-edit-btn">Cancel</a>
            <button type="submit" class="btn btn-primary" id="save-profile-btn">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="display: none;" id="save-spinner"></span>
              Save Changes
            </button>
          </div>
        </form>
      </div>

    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();
      
      // Update cancel/back buttons to link correctly
      const backBtn = document.getElementById('back-profile-btn');
      const cancelBtn = document.getElementById('cancel-edit-btn');
      const profilePath = `/profile.html?userId=${currentUser.user_id}`;
      if (backBtn) backBtn.href = profilePath;
      if (cancelBtn) cancelBtn.href = profilePath;

      // Select Input elements
      const firstNameInput = document.getElementById('firstName');
      const lastNameInput = document.getElementById('lastName');
      const bioInput = document.getElementById('bio');
      const locationInput = document.getElementById('location');
      const websiteInput = document.getElementById('website');

      const avatarPreview = document.getElementById('edit-profile-avatar-preview');

      // Populate current user data
      firstNameInput.value = currentUser.first_name || '';
      lastNameInput.value = currentUser.last_name || '';
      bioInput.value = currentUser.bio || '';
      locationInput.value = currentUser.location || '';
      websiteInput.value = currentUser.website || '';
      
      avatarPreview.src = currentUser.profile_picture_url || utils.defaultAvatar;

      // File triggers
      const avatarInput = document.getElementById('avatar-file-input');

      document.getElementById('avatar-overlay').addEventListener('click', () => avatarInput.click());

      // File preview updates
      avatarInput.addEventListener('change', () => {
        const file = avatarInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => avatarPreview.src = e.target.result;
          reader.readAsDataURL(file);
        }
      });

      // Submit Form
      const form = document.getElementById('edit-profile-form');
      const saveBtn = document.getElementById('save-profile-btn');
      const spinner = document.getElementById('save-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        spinner.style.display = 'inline-block';

        const formData = new FormData();
        formData.append('first_name', firstNameInput.value.trim());
        formData.append('last_name', lastNameInput.value.trim());
        formData.append('bio', bioInput.value.trim());
        formData.append('location', locationInput.value.trim());
        formData.append('website', websiteInput.value.trim());

        if (avatarInput.files[0]) {
          formData.append('avatar', avatarInput.files[0]);
        }

        try {
          const res = await api.upload(`/users/${currentUser.user_id}`, formData, 'PUT');
          
          if (res && res.data) {
            // Update stored user details in localStorage
            localStorage.setItem('user', JSON.stringify(res.data));
            utils.showToast('Profile updated successfully!', 'success');
            setTimeout(() => {
              window.location.href = `/profile.html?userId=${currentUser.user_id}`;
            }, 1000);
          }
        } catch (err) {
          utils.showToast(err.message || 'Failed to update profile.', 'error');
          saveBtn.disabled = false;
          spinner.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
