<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — View post details and join the conversation.">
  <title>Nebula — Post Detail</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      <div class="d-flex align-items-center mb-4 gap-3">
        <a href="/index.html" class="btn btn-outline border-0 text-muted p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;"><i class="bi bi-arrow-left" style="font-size:1.5rem;"></i></a>
        <h1 class="h3 font-weight-bold mb-0">Post</h1>
      </div>

      <!-- Main Post Card Target -->
      <div id="post-target">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </div>

      <!-- Comment Section Header -->
      <h3 class="h5 font-weight-bold mt-4 mb-3">Comments</h3>

      <!-- Comment Composer -->
      <div class="glass-panel mb-4">
        <form id="comment-form">
          <div class="d-flex gap-3">
            <img src="" alt="" class="avatar avatar-sm" id="commenter-avatar">
            <div class="flex-grow-1">
              <textarea class="form-control border-color bg-transparent text-primary" id="comment-content-input" placeholder="Post your reply..." rows="2" style="resize:none;" maxlength="500" required></textarea>
              <div class="d-flex justify-content-end mt-2">
                <button type="submit" class="btn btn-primary btn-sm" id="post-comment-btn" style="padding: 6px 16px;">Reply</button>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Comments List Target -->
      <div class="glass-panel mb-4">
        <div id="comments-container">
          <div class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/comments.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();
      const commenterAvatar = document.getElementById('commenter-avatar');
      if (commenterAvatar && currentUser) {
        commenterAvatar.src = currentUser.profile_picture_url || utils.defaultAvatar;
      }

      // Parse query params
      const urlParams = new URLSearchParams(window.location.search);
      const postId = parseInt(urlParams.get('postId'), 10);

      if (!postId) {
        window.location.href = '/index.html';
        return;
      }

      const postTarget = document.getElementById('post-target');
      const commentsContainer = document.getElementById('comments-container');

      // Load Post Detail
      try {
        const postResponse = await api.get(`/posts/${postId}`);
        if (postResponse && postResponse.data) {
          postTarget.innerHTML = posts.renderPostCard(postResponse.data, currentUser);
          posts.bindPostActions(postTarget, (deletedId) => {
            // If post gets deleted, redirect back home
            window.location.href = '/index.html';
          });
        }
      } catch (err) {
        postTarget.innerHTML = `<div class="glass-panel text-center py-5 text-danger">Post not found or has been deleted.</div>`;
        return;
      }

      // Load Comments List
      async function reloadComments() {
        commentsContainer.innerHTML = `<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>`;
        try {
          const commentList = await comments.loadComments(postId);
          if (commentList.length === 0) {
            commentsContainer.innerHTML = `<p class="text-muted text-center py-3 mb-0">No comments yet. Be the first to comment!</p>`;
            return;
          }
          commentsContainer.innerHTML = commentList.map(c => comments.renderComment(c, currentUser)).join('');
          comments.bindCommentActions(commentsContainer);
        } catch (err) {
          commentsContainer.innerHTML = `<p class="text-danger text-center py-3 mb-0">Failed to load comments.</p>`;
        }
      }

      reloadComments();

      // Comment Form Submission
      const commentForm = document.getElementById('comment-form');
      const commentInput = document.getElementById('comment-content-input');
      const postCommentBtn = document.getElementById('post-comment-btn');

      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const content = commentInput.value.trim();
        if (!content) return;

        postCommentBtn.disabled = true;
        try {
          await comments.addComment(postId, content);
          commentInput.value = '';
          await reloadComments();
        } catch (err) {
          // Toast handled in helper
        } finally {
          postCommentBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
