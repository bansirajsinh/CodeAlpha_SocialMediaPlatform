<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nebula — Upload a new post with image, description, and hashtags.">
  <title>Nebula — Upload Post</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      <div class="d-flex align-items-center mb-4 gap-3">
        <a href="/index.html" class="btn btn-outline border-0 text-muted p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;"><i class="bi bi-arrow-left" style="font-size:1.5rem;"></i></a>
        <h1 class="h3 font-weight-bold mb-0">Upload Post</h1>
      </div>

      <!-- Upload Post Form Card -->
      <div class="glass-panel mb-4">
        <form id="upload-post-form" enctype="multipart/form-data">
          
          <!-- Image Dropzone Area -->
          <div class="mb-4">
            <label class="form-label font-weight-bold">Select Post Image</label>
            
            <div class="upload-dropzone" id="dropzone-trigger">
              <i class="bi bi-cloud-arrow-up-fill"></i>
              <h5 class="mb-1 font-weight-bold">Choose or drag an image here</h5>
              <span class="text-muted small">Supports JPG, PNG, GIF up to 5MB</span>
              <input type="file" id="post-image-file" accept="image/*" style="display:none;">
            </div>

            <!-- Upload Image Preview Box (hidden by default) -->
            <div class="upload-preview-container mt-3" id="upload-preview-box" style="display:none;">
              <img src="" id="upload-preview-img" alt="Post upload image preview">
              <button type="button" class="upload-preview-remove" id="upload-preview-remove-btn">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>

          <!-- Description (Text content) -->
          <div class="form-group mb-4">
            <label for="post-description" class="form-label font-weight-bold">Description</label>
            <textarea class="form-control border-color bg-transparent text-primary" id="post-description" rows="4" placeholder="Write a description or caption..." required style="resize:none;" maxlength="1000"></textarea>
          </div>

          <!-- Hashtags -->
          <div class="form-group mb-4">
            <label for="post-hashtags" class="form-label font-weight-bold">Hashtags</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 border-color"><i class="bi bi-hash text-muted"></i></span>
              <input type="text" class="form-control border-start-0 border-color bg-transparent text-primary" id="post-hashtags" placeholder="technology, travel, design (comma or space separated)">
            </div>
            <span class="text-muted small mt-1 d-block">Tags will be formatted automatically (e.g. #technology #travel)</span>
          </div>

          <!-- Post Visibility -->
          <div class="row align-items-center mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="post-visibility-select" class="form-label font-weight-bold">Who can see this?</label>
              <select class="form-select border-color bg-transparent text-primary" id="post-visibility-select" style="cursor: pointer; box-shadow:none;">
                <option value="public" style="background:var(--bg-secondary);">Public (Everyone)</option>
                <option value="followers_only" style="background:var(--bg-secondary);">Followers Only</option>
                <option value="private" style="background:var(--bg-secondary);">Only Me (Private)</option>
              </select>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top border-color">
            <a href="/index.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary font-weight-bold px-4" id="upload-post-submit-btn">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="display: none;" id="upload-post-spinner"></span>
              Publish Post
            </button>
          </div>
        </form>
      </div>

    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/upload-post.js"></script>
</body>
</html>
