<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — Chat directly with your friends and connections.">
  <title>Nebula — Messages</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    /* Expand content space to fit chat window */
    .app-layout {
      grid-template-columns: var(--sidebar-width) 1fr;
    }
    .app-aside {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in d-flex flex-column" style="height: calc(100vh - var(--space-6) * 2);">
      <h1 class="h3 font-weight-bold mb-4">Direct Messages</h1>

      <!-- Chat Layout Grid -->
      <div class="chat-layout glass-panel p-0 flex-grow-1">
        
        <!-- Left Panel: Conversations List -->
        <div class="chat-inbox">
          <div class="chat-inbox-header d-flex justify-content-between align-items-center">
            <h2 class="h5 font-weight-bold mb-0">Inbox</h2>
            <button class="btn btn-outline border-0 text-primary p-1" id="new-message-btn" title="New Message"><i class="bi bi-pencil-square" style="font-size:1.2rem;"></i></button>
          </div>
          <div class="chat-conversations-list" id="inbox-list-target">
            <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>
          </div>
        </div>

        <!-- Right Panel: Active Chat Box -->
        <div class="chat-main" id="chat-main-panel">
          <!-- Empty State (Shown before a conversation is selected) -->
          <div class="d-flex flex-column align-items-center justify-content-center h-100 py-5 text-center" id="chat-empty-state">
            <i class="bi bi-chat-quote text-muted" style="font-size: 4rem;"></i>
            <h3 class="h4 font-weight-bold mt-3">Select a conversation</h3>
            <p class="text-muted">Choose a friend from the inbox list or start a new chat from their profile page.</p>
          </div>

          <!-- Chat Contents (Shown only when active conversation) -->
          <div class="d-none flex-column h-100" id="chat-active-contents">
            
            <!-- Chat Header -->
            <div class="chat-main-header">
              <a href="#" class="user-snippet" id="active-chat-user-link">
                <img src="" alt="" id="active-chat-avatar">
                <div class="user-snippet-details">
                  <span class="user-snippet-name" id="active-chat-name"></span>
                  <span class="user-snippet-username" id="active-chat-username"></span>
                </div>
              </a>
            </div>

            <!-- Messages Stream -->
            <div class="chat-message-area" id="chat-messages-stream">
              <!-- Dynamically populated -->
            </div>

            <!-- Attachment Preview Area -->
            <div class="p-2 border-top border-color bg-transparent" id="attachment-preview-box" style="display: none; position: relative;">
              <div class="message-attachment position-relative">
                <img src="" id="attachment-preview-img" style="max-height:100px; border-radius:var(--radius-sm);">
                <button type="button" class="btn btn-dark btn-sm rounded-circle position-absolute" id="attachment-remove-btn" style="top:5px; left:5px; padding:2px 6px;"><i class="bi bi-x"></i></button>
              </div>
            </div>

            <!-- Chat Footer Composer -->
            <div class="chat-footer">
              <form id="chat-composer-form">
                <div class="chat-input-row">
                  <input type="file" id="chat-file-input" accept="image/*" style="display: none;">
                  <button type="button" class="btn btn-outline border-0 text-primary p-2" id="attach-img-trigger"><i class="bi bi-image" style="font-size:1.3rem;"></i></button>
                  
                  <input type="text" class="form-control border-color bg-transparent text-primary py-2" id="chat-text-input" placeholder="Type a message..." required style="box-shadow:none;">
                  <button type="submit" class="btn btn-primary" id="chat-send-btn">Send</button>
                </div>
              </form>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- New Message Modal -->
  <div class="modal fade" id="new-message-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content glass-panel border-color" style="background:var(--bg-primary); backdrop-filter:var(--glass-blur);">
        <div class="modal-header border-color">
          <h5 class="modal-title font-weight-bold">New Message</h5>
          <button type="button" class="btn-close text-primary" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0" style="max-height: 400px; overflow-y: auto;" id="following-list-target">
          <!-- dynamic followed users list -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messages.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();
      const inboxList = document.getElementById('inbox-list-target');
      const emptyState = document.getElementById('chat-empty-state');
      const activeContents = document.getElementById('chat-active-contents');
      
      const activeAvatar = document.getElementById('active-chat-avatar');
      const activeName = document.getElementById('active-chat-name');
      const activeUsername = document.getElementById('active-chat-username');
      const activeLink = document.getElementById('active-chat-user-link');
      const messagesStream = document.getElementById('chat-messages-stream');

      const chatForm = document.getElementById('chat-composer-form');
      const textInput = document.getElementById('chat-text-input');
      const fileInput = document.getElementById('chat-file-input');
      const attachTrigger = document.getElementById('attach-img-trigger');
      const previewBox = document.getElementById('attachment-preview-box');
      const previewImg = document.getElementById('attachment-preview-img');
      const removeBtn = document.getElementById('attachment-remove-btn');

      let activeRecipientId = null;
      let pollingInterval = null;

      // Handle image attachment
      attachTrigger.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewBox.style.display = 'block';
            textInput.removeAttribute('required'); // image can be sent without text
          };
          reader.readAsDataURL(file);
        }
      });
      removeBtn.addEventListener('click', () => {
        fileInput.value = '';
        previewImg.src = '';
        previewBox.style.display = 'none';
        textInput.setAttribute('required', 'true');
      });

      // Load Conversations
      async function reloadInbox() {
        try {
          const conversations = await messages.loadConversations();
          if (conversations.length === 0) {
            inboxList.innerHTML = '<p class="text-muted text-center py-4 mb-0">No messages yet.</p>';
            return;
          }

          inboxList.innerHTML = conversations.map(c => {
            const user = {
              id: c.user_id,
              name: `${c.first_name || ''} ${c.last_name || ''}`.trim() || c.username,
              username: c.username,
              avatar: c.profile_picture_url
            };
            
            const isUnread = c.unread_count > 0;
            const activeClass = activeRecipientId === user.id ? 'active' : '';

            return `
              <div class="conversation-item ${activeClass} ${isUnread ? 'font-weight-bold' : ''}" data-user-id="${user.id}">
                <img src="${user.avatar || utils.defaultAvatar}" alt="${user.name}" class="avatar avatar-sm">
                <div class="conversation-meta">
                  <div class="conversation-name-row">
                    <span class="conversation-username">${user.name || ''}</span>
                    <span class="conversation-time">${utils.timeAgo(c.last_message_at)}</span>
                  </div>
                  <div class="conversation-preview">${utils.truncate(c.last_message || '')}</div>
                </div>
              </div>
            `;
          }).join('');

          // Bind inbox select clicks
          inboxList.querySelectorAll('.conversation-item').forEach(item => {
            item.addEventListener('click', (e) => {
              const uId = parseInt(e.currentTarget.getAttribute('data-user-id'), 10);
              selectConversation(uId);
            });
          });

        } catch (err) {
          inboxList.innerHTML = '<p class="text-danger text-center py-4 mb-0">Failed to load inbox.</p>';
        }
      }

      // Select active conversation
      async function selectConversation(recipientId) {
        activeRecipientId = recipientId;
        emptyState.classList.add('d-none');
        activeContents.classList.remove('d-none');
        activeContents.classList.add('d-flex');

        // Mark active item in inbox
        inboxList.querySelectorAll('.conversation-item').forEach(item => {
          const uId = parseInt(item.getAttribute('data-user-id'), 10);
          if (uId === recipientId) {
            item.classList.add('active');
            item.classList.remove('font-weight-bold');
          } else {
            item.classList.remove('active');
          }
        });

        // Set Header details
        try {
          const uProfile = await api.get(`/users/${recipientId}`);
          activeAvatar.src = uProfile.data.profile_picture_url || utils.defaultAvatar;
          activeName.innerText = `${uProfile.data.first_name || ''} ${uProfile.data.last_name || ''}`;
          activeUsername.innerText = `@${uProfile.data.username}`;
          activeLink.href = `/profile.html?userId=${recipientId}`;
        } catch (err) {}

        // Fetch messages
        await loadMessagesStream();

        // Start message polling
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(loadMessagesStream, 5000);
      }

      // Load active message history
      async function loadMessagesStream() {
        if (!activeRecipientId) return;

        try {
          const stream = await messages.loadConversation(activeRecipientId);
          const wasAtBottom = messagesStream.scrollHeight - messagesStream.clientHeight <= messagesStream.scrollTop + 50;

          messagesStream.innerHTML = stream.map(msg => {
            const isSent = msg.sender_id === currentUser.user_id;
            let imageHtml = '';
            if (msg.image_url) {
              imageHtml = `
                <div class="message-attachment">
                  <img src="${msg.image_url}" alt="attachment" style="max-width:100%; cursor:pointer;" onclick="window.open('${msg.image_url}')">
                </div>
              `;
            }

            return `
              <div class="message-bubble ${isSent ? 'sent' : 'received'}" id="msg-${msg.message_id}">
                ${imageHtml}
                <div>${msg.content}</div>
                <div style="font-size: 9px; opacity: 0.7; text-align: right; margin-top: 2px;">
                  ${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
            `;
          }).join('');

          // Auto scroll to bottom
          if (wasAtBottom || messagesStream.scrollTop === 0) {
            messagesStream.scrollTop = messagesStream.scrollHeight;
          }
        } catch (err) {}
      }

      // Submit Message Form
      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const content = textInput.value.trim();
        if (!content && !fileInput.files[0]) return;

        const sendBtn = document.getElementById('chat-send-btn');
        sendBtn.disabled = true;

        const formData = new FormData();
        formData.append('recipientId', activeRecipientId);
        formData.append('content', content);
        if (fileInput.files[0]) {
          formData.append('image', fileInput.files[0]);
        }

        try {
          await messages.sendMessage(formData);
          
          // Clear inputs
          textInput.value = '';
          fileInput.value = '';
          previewBox.style.display = 'none';
          previewImg.src = '';
          textInput.setAttribute('required', 'true');

          await loadMessagesStream();
          messagesStream.scrollTop = messagesStream.scrollHeight; // Force scroll to bottom
          await reloadInbox();
        } catch (err) {
          // Toast handled
        } finally {
          sendBtn.disabled = false;
        }
      });

      // Check if starting chat directly from profile page
      const urlParams = new URLSearchParams(window.location.search);
      const directRecipient = parseInt(urlParams.get('userId'), 10);
      await reloadInbox();
      
      if (directRecipient && directRecipient !== currentUser.user_id) {
        selectConversation(directRecipient);
      }

      // New Message modal initialization and load
      const newMessageModal = new bootstrap.Modal(document.getElementById('new-message-modal'));
      const followingListTarget = document.getElementById('following-list-target');

      document.getElementById('new-message-btn').addEventListener('click', async () => {
        followingListTarget.innerHTML = `<div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>`;
        newMessageModal.show();

        try {
          const res = await api.get(`/users/${currentUser.user_id}/following`);
          const followingUsers = (res && res.data && res.data.rows) ? res.data.rows : [];
          
          if (followingUsers.length === 0) {
            followingListTarget.innerHTML = `<p class="text-muted text-center py-4 mb-0">You are not following anyone yet.</p>`;
            return;
          }

          followingListTarget.innerHTML = followingUsers.map(user => `
            <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-color new-chat-user-item" data-user-id="${user.user_id}" style="cursor:pointer;">
              <div class="user-snippet">
                <img src="${user.profile_picture_url || utils.defaultAvatar}" alt="${user.username}" style="width:36px; height:36px;">
                <div class="user-snippet-details">
                  <span class="user-snippet-name" style="font-size: var(--font-size-sm);">${user.first_name || ''} ${user.last_name || ''}</span>
                  <span class="user-snippet-username" style="font-size: 11px;">@${user.username}</span>
                </div>
              </div>
            </div>
          `).join('');

          // Bind click to select conversation and start messaging
          followingListTarget.querySelectorAll('.new-chat-user-item').forEach(item => {
            item.addEventListener('click', (e) => {
              const uId = parseInt(e.currentTarget.getAttribute('data-user-id'), 10);
              newMessageModal.hide();
              selectConversation(uId);
            });
          });
        } catch (err) {
          followingListTarget.innerHTML = `<p class="text-danger text-center py-4 mb-0">Failed to load following list.</p>`;
        }
      });
    });
  </script>
</body>
</html>
