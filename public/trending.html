<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover trending hashtags and popular posts.">
  <title>Nebula — Trending</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 font-weight-bold mb-0">Explore</h1>
      </div>

      <!-- Trending Hashtags Grid section -->
      <div class="glass-panel mb-4">
        <h2 class="h5 font-weight-bold mb-3"><i class="bi bi-fire text-danger me-2"></i>Trending Hashtags</h2>
        <div class="row" id="trending-grid-list">
          <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>
        </div>
      </div>

      <!-- Popular Posts Section -->
      <h2 class="h5 font-weight-bold mb-3 px-2"><i class="bi bi-star-fill text-warning me-2"></i>Popular Posts</h2>
      <div id="popular-posts-container">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </div>

    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/search.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();
      const tagsGrid = document.getElementById('trending-grid-list');
      const postsContainer = document.getElementById('popular-posts-container');

      // Fetch Trending tags
      try {
        const tags = await search.getTrending();
        if (tags.length === 0) {
          tagsGrid.innerHTML = '<div class="col-12 text-center text-muted">No trending topics today.</div>';
        } else {
          tagsGrid.innerHTML = tags.slice(0, 6).map(tag => `
            <div class="col-md-4 col-sm-6 mb-3">
              <a href="/search.html?q=${encodeURIComponent(tag.tag_name)}&type=hashtags" class="d-block glass-panel p-3 text-decoration-none trending-item m-0" style="background:var(--bg-secondary);">
                <span class="trending-tag" style="font-size: var(--font-size-base); font-weight: 700;">#${tag.tag_name}</span>
                <span class="trending-count mt-1">${tag.usage_count} posts</span>
              </a>
            </div>
          `).join('');
        }
      } catch (err) {
        tagsGrid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load trending tags.</div>';
      }

      // Fetch Popular posts
      try {
        const response = await api.get('/search/popular');
        if (response && response.data) {
          const list = response.data || [];
          if (list.length === 0) {
            postsContainer.innerHTML = '<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No popular posts today.</p></div>';
            return;
          }
          postsContainer.innerHTML = list.map(post => posts.renderPostCard(post, currentUser)).join('');
          posts.bindPostActions(postsContainer);
        }
      } catch (err) {
        postsContainer.innerHTML = '<div class="glass-panel text-center py-5 text-danger">Failed to load popular posts.</div>';
      }
    });
  </script>
</body>
</html>
