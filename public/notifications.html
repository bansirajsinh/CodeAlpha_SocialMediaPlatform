<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — View your activity notifications.">
  <title>Nebula — Notifications</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 font-weight-bold mb-0">Notifications</h1>
        <button class="btn btn-outline btn-sm" id="mark-all-read-btn" style="display: none;"><i class="bi bi-check2-all me-1"></i> Mark all read</button>
      </div>

      <!-- Notifications List -->
      <div class="glass-panel p-0 mb-4 overflow-hidden">
        <div id="notifications-container">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!auth.isAuthenticated()) return;

      const container = document.getElementById('notifications-container');
      const markAllBtn = document.getElementById('mark-all-read-btn');

      async function loadNotifications() {
        container.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
        try {
          const { notifications: list, unreadCount } = await notifications.loadNotifications();
          
          if (unreadCount > 0) {
            markAllBtn.style.display = 'inline-flex';
          } else {
            markAllBtn.style.display = 'none';
          }

          if (list.length === 0) {
            container.innerHTML = `
              <div class="text-center py-5">
                <i class="bi bi-bell-slash text-muted" style="font-size: 3rem;"></i>
                <h4 class="mt-3 font-weight-bold">All quiet here</h4>
                <p class="text-muted mb-0">We will notify you when someone interacts with your posts.</p>
              </div>
            `;
            return;
          }

          container.innerHTML = list.map(item => {
            const isUnread = !item.is_read;
            
            let iconHtml = '';
            let actionText = '';
            let targetUrl = '#';

            if (item.notification_type === 'like') {
              iconHtml = `<i class="bi bi-heart-fill notification-icon-like"></i>`;
              actionText = `liked your post`;
              targetUrl = `/post-detail.html?postId=${item.post_id}`;
            } else if (item.notification_type === 'comment') {
              iconHtml = `<i class="bi bi-chat-fill notification-icon-comment"></i>`;
              actionText = `commented on your post: "${utils.truncate(item.message, 60)}"`;
              targetUrl = `/post-detail.html?postId=${item.post_id}`;
            } else if (item.notification_type === 'follow') {
              iconHtml = `<i class="bi bi-person-fill-plus notification-icon-follow"></i>`;
              actionText = `started following you`;
              targetUrl = `/profile.html?userId=${item.actor_id}`;
            }

            const verifiedBadge = item.is_verified ? '<i class="bi bi-patch-check-fill text-primary ms-1" style="font-size:0.875rem;"></i>' : '';

            return `
              <div class="notification-item ${isUnread ? 'unread' : ''}" id="notif-${item.notification_id}" style="cursor:pointer;" onclick="handleNotifClick(${item.notification_id}, '${targetUrl}', ${isUnread})">
                <div class="notification-icon-wrapper">
                  ${iconHtml}
                </div>
                <div class="d-flex align-items-center gap-3 flex-grow-1 min-width-0">
                  <img src="${item.profile_picture_url || utils.defaultAvatar}" alt="${item.username}" class="avatar avatar-sm">
                  <div style="flex:1; min-width:0; line-height:1.3;">
                    <div style="font-size:var(--font-size-base);">
                      <strong style="color:var(--text-primary);">${item.first_name || ''} ${item.last_name || ''}</strong>
                      ${verifiedBadge}
                      <span class="text-muted">@${item.username}</span>
                      <span style="color:var(--text-secondary);">${actionText}</span>
                    </div>
                    <span class="text-tertiary text-small">${utils.timeAgo(item.created_at)}</span>
                  </div>
                </div>
                <div>
                  <button class="btn btn-link text-muted p-1 delete-notif-btn" data-notif-id="${item.notification_id}" style="box-shadow:none;"><i class="bi bi-x-lg"></i></button>
                </div>
              </div>
            `;
          }).join('');

          // Bind delete actions
          document.querySelectorAll('.delete-notif-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const notifId = e.currentTarget.getAttribute('data-notif-id');
              try {
                await notifications.deleteNotification(notifId);
                const node = document.getElementById(`notif-${notifId}`);
                if (node) node.remove();
                
                // Refresh sidebar layout to update notification badge
                utils.renderLayout();
              } catch (err) {
                // Handled
              }
            });
          });

        } catch (err) {
          container.innerHTML = `<div class="text-danger text-center py-5">Failed to load notifications.</div>`;
        }
      }

      // Handle clicking notification card
      window.handleNotifClick = async (notifId, targetUrl, isUnread) => {
        if (isUnread) {
          await notifications.markAsRead(notifId);
        }
        window.location.href = targetUrl;
      };

      loadNotifications();

      // Clear all notifications
      markAllBtn.addEventListener('click', async () => {
        try {
          await notifications.markAllAsRead();
          await loadNotifications();
          utils.renderLayout(); // Refresh badge counts
        } catch (err) {
          // Handled
        }
      });
    });
  </script>
</body>
</html>
