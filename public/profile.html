<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Media Platform — View user profile, statistics, and posts.">
  <title>Nebula — Profile</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar-target">
      <!-- Dynamically generated by utils.js -->
    </aside>

    <!-- Main Content -->
    <main class="app-main animate-fade-in">
      
      <!-- Back Arrow + Title -->
      <div class="d-flex align-items-center mb-3 gap-3">
        <a href="/index.html" class="btn btn-outline border-0 text-muted p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;"><i class="bi bi-arrow-left" style="font-size:1.5rem;"></i></a>
        <div>
          <h1 class="h4 font-weight-bold mb-0" id="profile-title-name">Loading Profile...</h1>
          <span class="text-muted text-small" id="profile-title-posts">0 posts</span>
        </div>
      </div>

      <!-- Profile Header (Centered Card without Banner) -->
      <div class="glass-panel text-center p-5 mb-4 position-relative">
        <!-- Profile Avatar in the middle -->
        <div class="d-flex justify-content-center mb-3">
          <img src="" alt="Profile picture" class="profile-avatar-img-centered" id="profile-avatar">
        </div>
        
        <!-- Name + Verified Badge centered -->
        <div class="d-flex align-items-center justify-content-center mb-1">
          <h2 class="profile-fullname mb-0" id="profile-name"></h2>
          <i class="bi bi-patch-check-fill text-primary ms-2" id="profile-verified" style="font-size:1.5rem; display:none;" title="Verified Profile"></i>
        </div>
        <p class="profile-username mb-3" id="profile-username"></p>
        
        <!-- Bio centered -->
        <p class="profile-bio px-md-5 mb-3" id="profile-bio"></p>

        <!-- Location + Website centered -->
        <div class="d-flex flex-wrap justify-content-center gap-3 text-muted text-small mb-4">
          <span id="profile-location" style="display:none;"><i class="bi bi-geo-alt me-1"></i></span>
          <span id="profile-website" style="display:none;"><i class="bi bi-link-45deg me-1"></i></span>
        </div>

        <!-- Stats Row centered -->
        <div class="profile-stats-row justify-content-center mb-4">
          <div class="profile-stat-item">
            <span class="profile-stat-count" id="stat-posts-count">0</span>
            <span class="profile-stat-label">Posts</span>
          </div>
          <a href="#" class="profile-stat-item text-decoration-none" id="followers-link" style="color:inherit;">
            <span class="profile-stat-count" id="stat-followers-count">0</span>
            <span class="profile-stat-label">Followers</span>
          </a>
          <a href="#" class="profile-stat-item text-decoration-none" id="following-link" style="color:inherit;">
            <span class="profile-stat-count" id="stat-following-count">0</span>
            <span class="profile-stat-label">Following</span>
          </a>
        </div>

        <!-- Action Area (Follow/Edit Profile) centered -->
        <div id="profile-action-area" class="d-flex justify-content-center gap-2">
          <!-- Follow or Edit Profile Button -->
        </div>
      </div>

      <!-- Profile Tabs -->
      <ul class="nav nav-tabs border-color mb-4" id="profileTabs" role="tablist" style="border-bottom: 1px solid var(--border-color);">
        <li class="nav-item" role="presentation">
          <button class="nav-link active bg-transparent border-0 font-weight-semibold text-primary" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-panel" type="button" role="tab" style="box-shadow:none; border-bottom: 2px solid var(--color-primary) !important;">Posts</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link bg-transparent border-0 font-weight-semibold text-muted" id="likes-tab" data-bs-toggle="tab" data-bs-target="#likes-panel" type="button" role="tab" style="box-shadow:none;">Likes</button>
        </li>
      </ul>

      <div class="tab-content" id="profileTabsContent">
        <!-- Posts Panel -->
        <div class="tab-pane fade show active" id="posts-panel" role="tabpanel" aria-labelledby="posts-tab">
          <div id="profile-posts-container">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
          </div>
        </div>
        <!-- Likes Panel -->
        <div class="tab-pane fade" id="likes-panel" role="tabpanel" aria-labelledby="likes-tab">
          <div id="profile-likes-container">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Aside -->
    <aside class="app-aside" id="aside-target">
      <!-- Dynamically generated by utils.js -->
    </aside>
  </div>

  <!-- Followers / Following Modal -->
  <div class="modal fade" id="social-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content glass-panel border-color" style="background:var(--bg-primary); backdrop-filter:var(--glass-blur);">
        <div class="modal-header border-color">
          <h5 class="modal-title font-weight-bold" id="social-modal-title">Followers</h5>
          <button type="button" class="btn-close text-primary" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0" style="max-height: 400px; overflow-y: auto;" id="social-modal-list">
          <!-- User list dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/profile.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.isAuthenticated()) return;

      const currentUser = auth.getCurrentUser();

      // Parse user id from URL query params
      const urlParams = new URLSearchParams(window.location.search);
      let userId = parseInt(urlParams.get('userId'), 10);
      if (!userId && currentUser) {
        userId = currentUser.user_id;
      }

      if (!userId) return;

      // Load Profile Data
      let userProfileData;
      try {
        userProfileData = await profile.loadProfile(userId);
        profile.renderProfile(userProfileData, currentUser);
        
        document.getElementById('profile-title-name').innerText = `${userProfileData.first_name || ''} ${userProfileData.last_name || ''}`;
        document.getElementById('profile-title-posts').innerText = `${userProfileData.post_count || 0} posts`;
      } catch (err) {
        document.getElementById('profile-posts-container').innerHTML = `<div class="glass-panel text-center py-5 text-danger">User profile not found.</div>`;
        return;
      }

      // Load User Posts
      const postsContainer = document.getElementById('profile-posts-container');
      async function loadUserPosts() {
        postsContainer.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
        try {
          const response = await api.get(`/posts?userId=${userId}&limit=20`);
          if (response && response.data) {
            const postsList = response.data.rows || [];
            if (postsList.length === 0) {
              postsContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No posts published yet.</p></div>`;
              return;
            }
            postsContainer.innerHTML = postsList.map(post => posts.renderPostCard(post, currentUser)).join('');
            posts.bindPostActions(postsContainer, () => {
              // Update posts counters if one gets deleted
              userProfileData.post_count = Math.max(0, userProfileData.post_count - 1);
              document.getElementById('stat-posts-count').innerText = userProfileData.post_count;
              document.getElementById('profile-title-posts').innerText = `${userProfileData.post_count} posts`;
            });
          }
        } catch (err) {
          postsContainer.innerHTML = `<div class="glass-panel text-danger text-center py-5">Failed to load posts.</div>`;
        }
      }

      // Load Liked Posts
      const likesContainer = document.getElementById('profile-likes-container');
      async function loadLikedPosts() {
        likesContainer.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
        try {
          const response = await api.get(`/posts?likedBy=${userId}&limit=20`);
          if (response && response.data) {
            const likedList = response.data.rows || [];
            if (likedList.length === 0) {
              likesContainer.innerHTML = `<div class="glass-panel text-center py-5"><p class="text-muted mb-0">No liked posts yet.</p></div>`;
              return;
            }
            likesContainer.innerHTML = likedList.map(post => posts.renderPostCard(post, currentUser)).join('');
            posts.bindPostActions(likesContainer);
          }
        } catch (err) {
          likesContainer.innerHTML = `<div class="glass-panel text-danger text-center py-5">Failed to load liked posts.</div>`;
        }
      }

      loadUserPosts();

      // Tab switcher toggler binding
      document.getElementById('posts-tab').addEventListener('click', (e) => {
        document.getElementById('likes-tab').classList.remove('text-primary');
        document.getElementById('likes-tab').classList.add('text-muted');
        document.getElementById('likes-tab').style.borderBottom = 'none';
        
        e.target.classList.add('text-primary');
        e.target.classList.remove('text-muted');
        e.target.style.borderBottom = '2px solid var(--color-primary)';
        loadUserPosts();
      });

      document.getElementById('likes-tab').addEventListener('click', (e) => {
        document.getElementById('posts-tab').classList.remove('text-primary');
        document.getElementById('posts-tab').classList.add('text-muted');
        document.getElementById('posts-tab').style.borderBottom = 'none';
        
        e.target.classList.add('text-primary');
        e.target.classList.remove('text-muted');
        e.target.style.borderBottom = '2px solid var(--color-primary)';
        loadLikedPosts();
      });

      // Followers / Following Modal Loader
      const socialModal = new bootstrap.Modal(document.getElementById('social-modal'));
      const socialTitle = document.getElementById('social-modal-title');
      const socialList = document.getElementById('social-modal-list');

      async function showSocialList(type) {
        socialTitle.innerText = type === 'followers' ? 'Followers' : 'Following';
        socialList.innerHTML = `<div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>`;
        socialModal.show();

        try {
          const res = await api.get(`/users/${userId}/${type}`);
          if (res && res.data && res.data.rows && res.data.rows.length > 0) {
            socialList.innerHTML = res.data.rows.map(user => `
              <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-color">
                <a href="/profile.html?userId=${user.user_id}" class="user-snippet" style="text-decoration:none;">
                  <img src="${user.profile_picture_url || utils.defaultAvatar}" alt="${user.username}" style="width:36px; height:36px;">
                  <div class="user-snippet-details">
                    <span class="user-snippet-name" style="font-size: var(--font-size-sm);">${user.first_name || ''} ${user.last_name || ''}</span>
                    <span class="user-snippet-username" style="font-size: 11px;">@${user.username}</span>
                  </div>
                </a>
              </div>
            `).join('');
          } else {
            socialList.innerHTML = `<p class="text-muted text-center py-4 mb-0">No users found.</p>`;
          }
        } catch (err) {
          socialList.innerHTML = `<p class="text-danger text-center py-4 mb-0">Failed to load list.</p>`;
        }
      }

      document.getElementById('followers-link').addEventListener('click', (e) => {
        e.preventDefault();
        showSocialList('followers');
      });

      document.getElementById('following-link').addEventListener('click', (e) => {
        e.preventDefault();
        showSocialList('following');
      });
    });
  </script>
</body>
</html>
